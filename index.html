const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mold=t=>esc(t).split("___").join('<span class="slot"></span>');
const pool=()=>BUILTIN.concat(S.custom);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S.custom))}catch(e){}};

function newRound(){
  const p=pool();
  if(p.length>1){let n=S.topic;while(n.de===S.topic.de)n=p[Math.floor(Math.random()*p.length)];S.topic=n}
  S.i=0;S.alt=false;render();
}

function render(){
  const L=UI[S.lang],T=TURNS,done=S.i>=T.length,t=done?null:T[S.i];
  const accent=t?(t.role==="A"?"var(--a)":"var(--b)"):"var(--ink)";
  let h="";

  h+='<div class="head between"><div>'
   +'<div class="label">'+L.roundTopic+'</div>'
   +'<div class="topic">'+esc(S.topic.de)+'</div>'
   +'<div class="gloss">'+esc(S.topic.custom?(S.topic.gloss||""):S.topic[S.lang])+'</div></div>'
   +'<div class="row"><button data-a="lang">'+L.other+'</button>'
   +'<button class="on" data-a="round">'+L.newTopic+'</button></div></div>';

  h+='<div class="row" style="margin:14px 0 18px">'
   +'<button data-a="tr" class="'+(S.tr?"on":"")+'">'+(S.tr?L.trOn:L.trOff)+'</button>'
   +'<button data-a="ex" class="'+(S.ex?"on":"")+'">'+(S.ex?L.exOn:L.exOff)+'</button>'
   +'<button data-a="panel">'+(S.panel?L.close:L.addTopic+" ("+S.custom.length+")")+'</button></div>';

  if(S.panel){
    h+='<div class="panel"><div class="serif" style="font-size:1.15rem;margin-bottom:10px">'+L.formTitle+'</div>'
     +'<label style="font-size:.78rem;color:var(--muted)">'+L.fieldDe
     +'<input id="fDe" value="'+esc(S.fDe)+'" placeholder="einen Flohmarkt für den Sportverein"></label>'
     +'<div style="font-size:.72rem;color:var(--muted);margin-top:4px">'+L.hintDe+'</div>'
     +'<label style="font-size:.78rem;color:var(--muted);display:block;margin-top:12px">'+L.fieldGloss
     +'<input id="fGloss" value="'+esc(S.fGloss)+'"></label>'
     +'<div class="row" style="margin-top:14px"><button class="solid" data-a="add">'+L.save+'</button>'
     +'<button data-a="panel">'+L.cancel+'</button></div>'
     +'<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:12px">'
     +'<div style="font-size:.78rem;color:var(--muted);margin-bottom:8px">'+L.myTopics+'</div>';
    h+=S.custom.length?S.custom.map((c,k)=>'<div class="between" style="padding:5px 0"><span class="serif">'+esc(c.de)
      +(c.gloss?'<span style="color:var(--muted);font-size:.82rem"> — '+esc(c.gloss)+'</span>':'')
      +'</span><button data-a="del" data-k="'+k+'" style="padding:2px 8px">'+L.remove+'</button></div>').join("")
      :'<div style="font-size:.85rem;color:var(--muted)">'+L.emptyCustom+'</div>';
    h+='</div></div>';
  }

  if(!done){
    h+='<div class="card" style="border-left-color:'+accent+'">'
     +'<div class="between" style="margin-bottom:14px"><div>'
     +'<span style="color:'+accent+';font-weight:700;font-size:1.05rem">'+L.speaks+' '+t.role+'</span>'
     +'<span style="color:var(--muted);font-size:.85rem"> — '+esc(t.fn[S.lang])+'</span></div>'
     +'<span style="color:var(--muted);font-size:.78rem;white-space:nowrap">'+(S.i+1)+'/'+T.length+' · '+t.step+'</span></div>'
     +'<p class="mold" style="color:'+accent+'"><span style="color:var(--ink)">'+mold(S.alt?t.altDe:t.de)+'</span></p>';
    if(S.tr)h+='<p class="tr">'+esc(S.alt?t.altTr[S.lang]:t.tr[S.lang])+'</p>';
    h+='<button data-a="alt" style="margin-top:14px">'+(S.alt?L.mainWording:L.otherWording)+'</button>';
    if(S.ex){
      h+='<div class="exwrap"><div style="font-size:.72rem;color:var(--muted);margin-bottom:4px">'+L.howItLooks+'</div>'
       +'<p class="ex" style="color:'+(S.topic.custom?"var(--muted)":accent)+';font-style:'+(S.topic.custom?"italic":"normal")+'">'
       +esc(S.topic.custom?L.noExample:S.topic.ex[S.i])+'</p></div>';
    }
    h+='<div class="tip">'+esc(t.tip[S.lang])+'</div></div>';
  }else{
    h+='<div class="card"><div class="serif" style="font-size:1.5rem;margin-bottom:12px">'+L.doneTitle+'</div><ul>'
     +L.checklist.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul>'
     +'<button class="on" data-a="round" style="margin-top:18px">'+L.startAnother+'</button></div>';
  }

  h+='<div class="bars">'+T.map((x,k)=>'<button data-a="go" data-k="'+k+'" class="'+(k===S.i?"now":"")
   +'" style="background:'+(k<=S.i?(x.role==="A"?"var(--a)":"var(--b)"):"var(--line)")+'"></button>').join("")+'</div>';

  h+='<div class="nav"><button data-a="prev"'+(S.i===0?" disabled":"")+'>'+L.back+'</button>'
   +'<span class="keys">'+L.keys+'</span>'
   +'<button class="solid" data-a="next"'+(done?" disabled":"")+' style="padding:8px 20px">'+L.next+'</button></div>';

  document.getElementById("app").innerHTML=h;
}

document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.a,k=+b.dataset.k;
  const fDe=document.getElementById("fDe"),fG=document.getElementById("fGloss");
  if(fDe){S.fDe=fDe.value;S.fGloss=fG.value}
  if(a==="lang")S.lang=S.lang==="es"?"en":"es";
  else if(a==="round")return newRound();
  else if(a==="tr")S.tr=!S.tr;
  else if(a==="ex")S.ex=!S.ex;
  else if(a==="panel")S.panel=!S.panel;
  else if(a==="alt")S.alt=!S.alt;
  else if(a==="go"){S.i=k;S.alt=false}
  else if(a==="prev"){S.i=Math.max(0,S.i-1);S.alt=false}
  else if(a==="next"){S.i=Math.min(TURNS.length,S.i+1);S.alt=false}
  else if(a==="del"){if(S.custom[k].de===S.topic.de)S.topic=BUILTIN[0];S.custom.splice(k,1);save()}
  else if(a==="add"){
    if(!S.fDe.trim())return;
    S.custom.push({de:S.fDe.trim(),gloss:S.fGloss.trim(),custom:true});
    S.fDe="";S.fGloss="";S.panel=false;save();
  }
  render();
});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();S.i=Math.min(TURNS.length,S.i+1);S.alt=false;render()}
  if(e.key==="ArrowLeft"){S.i=Math.max(0,S.i-1);S.alt=false;render()}
});

render();
</script>
</body>
</html>
